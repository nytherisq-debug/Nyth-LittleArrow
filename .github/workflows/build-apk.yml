name: Build NythAtom APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Patch and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NYTH_KS_PASS: ${{ secrets.NYTH_KS_PASS || 'NythBuild2026' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            aapt \
            apksigner \
            zipalign

          java -version
          python3 --version
          apksigner --version
          zipalign -h 2>&1 | head -n 2 || true

      - name: Install Apktool 2.12.1
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" \
            -o "$RUNNER_TEMP/apktool.jar"

          sudo install -m 644 "$RUNNER_TEMP/apktool.jar" \
            /usr/local/bin/apktool.jar

          printf '#!/usr/bin/env sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null

          sudo chmod 755 /usr/local/bin/apktool
          apktool --version

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f build.sh
          test -f apply_patch.py
          test -f nyth/backup/ZenoATom_7_0.apk

          echo "Project files found."
          echo "Original APK SHA256:"
          sha256sum nyth/backup/ZenoATom_7_0.apk

      - name: Build patched APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh
          ./build.sh

      - name: Locate build output
        id: output
        shell: bash
        run: |
          set -euo pipefail

          echo "Files produced by build:"
          find . -type f \
            \( -name "*.apk" -o -name "*.idsig" \) \
            -not -path "./nyth/backup/*" \
            -print

          APK_PATH="$(find . -type f -name "*.apk" \
            -not -path "./nyth/backup/*" \
            -not -path "./.git/*" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No output APK was generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nyth-output"
          cp "$APK_PATH" "$RUNNER_TEMP/nyth-output/NythAtom-patched.apk"

          echo "apk=$RUNNER_TEMP/nyth-output/NythAtom-patched.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          apksigner verify --verbose --print-certs \
            "$RUNNER_TEMP/nyth-output/NythAtom-patched.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NythAtom-patched-APK
          path: ${{ steps.output.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
