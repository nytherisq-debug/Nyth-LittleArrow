name: Build Nyth Atom APK

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip python3 openssl

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            -o /tmp/apktool.jar
          sudo install -m 644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          printf '#!/usr/bin/env sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod 755 /usr/local/bin/apktool
          apktool --version

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -s NythAtom_patch_project.zip
          mkdir -p "$RUNNER_TEMP/nyth"
          unzip -q NythAtom_patch_project.zip -d "$RUNNER_TEMP/nyth"
          test -f "$RUNNER_TEMP/nyth/nyth/build.sh"
          echo "PROJECT=$RUNNER_TEMP/nyth/nyth" >> "$GITHUB_ENV"

      - name: Verify original APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          sha256sum -c backup/SHA256SUMS.txt
          python3 -m py_compile apply_patch.py tools/make_assets.py

      - name: Set signing password
        shell: bash
        run: echo "NYTH_KS_PASS=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          chmod +x build.sh
          ./build.sh
          test -s build/NythAtom-7.0-nyth1-signed.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/build/NythAtom-7.0-nyth1-signed.apk"
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -v 4 "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NythAtom-APK
          path: ${{ runner.temp }}/nyth/nyth/build/NythAtom-7.0-nyth1-signed.apk
          if-no-files-found: error
          retention-days: 7
